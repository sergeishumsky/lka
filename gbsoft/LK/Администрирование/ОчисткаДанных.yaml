ВидЭлемента: КомпонентИнтерфейса
Ид: c398419c-a380-4a68-b795-4a610d360d96
Имя: ОчисткаДанных
ОбластьВидимости: ВПроекте
Импорт:
    - gbsoft::LK::Основное
Свойства:
    -
        Имя: НачалоПериода
        Тип: ДатаВремя?
    -
        Имя: КонецПериода
        Тип: ДатаВремя?
    -
        Имя: НачалоАнализа
        Тип: ДатаВремя?
    -
        Имя: КонецАнализа
        Тип: ДатаВремя?
    -
        Имя: Файлы
        Тип: Массив<ФайлДляОчистки>
    -
        Имя: ОбработаноДокументов
        Тип: Число
    -
        Имя: ВсегоРекламаций
        Тип: Число
    -
        Имя: ПодтверждениеВсех
        Тип: Булево
    -
        Имя: ВыполняетсяОчистка
        Тип: Булево
    -
        Имя: ЕстьЕще
        Тип: Булево
    -
        Имя: Подтверждение
        Тип: Булево
    -
        Имя: Сообщение
        Тип: Строка
Наследует:
    Тип: Форма
    Заголовок: Очистка данных
    Содержимое:
        Тип: ПроизвольныйШаблонФормы
        Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            Содержимое:
                -
                    Тип: Надпись
                    Значение: ="Период даты рекламации (включая указанное время)"
                -
                    Тип: Группа
                    Компоновка: Горизонтальная
                    Содержимое:
                        -
                            Тип: ПолеВвода<ДатаВремя?>
                            Заголовок: С
                            Доступность: =не ВыполняетсяОчистка
                            Значение: =НачалоПериода
                        -
                            Тип: ПолеВвода<ДатаВремя?>
                            Заголовок: По
                            Доступность: =не ВыполняетсяОчистка
                            Значение: =КонецПериода
                        -
                            Тип: Кнопка
                            Заголовок: Найти файлы
                            Доступность: =не ВыполняетсяОчистка
                            ПриНажатии: НайтиПриНажатии
                        -
                            Тип: Кнопка
                            Заголовок: Следующие 100 рекламаций
                            Доступность: =ЕстьЕще и не ВыполняетсяОчистка
                            ПриНажатии: СледующиеПриНажатии
                -
                    Тип: Надпись
                    Значение: =Сообщение
                -
                    Тип: Надпись
                    Значение: '="Всего рекламаций по фильтру (статус «Отгружено»): %{ВсегоРекламаций}"'
                -
                    Тип: Надпись
                    Значение: '="Общий объём загруженных вложений: %{ПолучитьОбщийОбъемМБ()} МБ"'
                -
                    Тип: Таблица<ИсточникДанныхМассив<ФайлДляОчистки>>
                    Имя: ТаблицаФайлов
                    РастягиватьПоГоризонтали: Истина
                    Навигация: ПодгрузкаПриПрокрутке
                    ОтображатьШапку: Истина
                    ОтображатьНастройки: Ложь
                    ТолькоЧтение: Истина
                    Источник:
                        Данные: =Файлы
                    Колонки:
                        -
                            Тип: СтандартнаяКолонкаТаблицы<ФайлДляОчистки>
                            Имя: КолонкаРекламация
                            Заголовок: Рекламация
                            ПолеЗначения: Рекламация
                            Ширина: 120
                            РазрешитьСжатие: Ложь
                            ТолькоЧтение: Истина
                            ОбрабатыватьНажатие: Ложь
                        -
                            Тип: СтандартнаяКолонкаТаблицы<ФайлДляОчистки>
                            Имя: КолонкаКлиент
                            Заголовок: Клиент
                            ПолеЗначения: Клиент
                            Ширина: 240
                            РазрешитьСжатие: Ложь
                            ТолькоЧтение: Истина
                            ОбрабатыватьНажатие: Ложь
                        -
                            Тип: СтандартнаяКолонкаТаблицы<ФайлДляОчистки>
                            Имя: КолонкаДатаРекламации
                            Заголовок: Дата рекламации
                            ПолеЗначения: ДатаРекламации
                            Ширина: 190
                            РазрешитьСжатие: Ложь
                            ТолькоЧтение: Истина
                            ОбрабатыватьНажатие: Ложь
                        -
                            Тип: СтандартнаяКолонкаТаблицы<ФайлДляОчистки>
                            Имя: КолонкаСтатусРекламации
                            Заголовок: Статус
                            ПолеЗначения: СтатусРекламации
                            Ширина: 120
                            РазрешитьСжатие: Ложь
                            ТолькоЧтение: Истина
                            ОбрабатыватьНажатие: Ложь
                        -
                            Тип: СтандартнаяКолонкаТаблицы<ФайлДляОчистки>
                            Имя: КолонкаИмяФайла
                            Заголовок: Имя файла
                            ПолеЗначения: ИмяФайла
                            Ширина: 240
                            РазрешитьСжатие: Ложь
                            ТолькоЧтение: Истина
                            ОбрабатыватьНажатие: Ложь
                        -
                            Тип: СтандартнаяКолонкаТаблицы<ФайлДляОчистки>
                            Имя: КолонкаРазмер
                            Заголовок: Размер, байт
                            ПолеЗначения: Размер
                            Ширина: 160
                            РазрешитьСжатие: Ложь
                            ТолькоЧтение: Истина
                            ОбрабатыватьНажатие: Ложь
                -
                    Тип: Флажок
                    Заголовок: Подтверждаю удаление показанных вложений из рекламаций
                    Доступность: =не ВыполняетсяОчистка
                    Значение: =Подтверждение
                -
                    Тип: Кнопка
                    Заголовок: Очистить показанные файлы
                    Доступность: =не ВыполняетсяОчистка
                    ПриНажатии: ОчиститьПриНажатии
                -
                    Тип: Флажок
                    Заголовок: =ТекстПодтвержденияПолнойОчистки()
                    Значение: =ПодтверждениеВсех
                    Доступность: =не ВыполняетсяОчистка
                -
                    Тип: Кнопка
                    Заголовок: Очистить все вложения за период
                    ПриНажатии: ОчиститьВсеПриНажатии
                    Доступность: =не ВыполняетсяОчистка
